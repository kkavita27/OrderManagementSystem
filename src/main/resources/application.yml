server:
  port: 8082
  error:
      include-message: always
      include-binding-errors: always

  debug: true

spring:
     main:
        banner-mode: off

     h2:
        console:
          enabled: true
          path: /h2-console # Optional: custom path for the console

     settings:
        web-allow-others: true # Optional: allows remote connections (use with caution)

     datasource:
       url: jdbc:h2:mem:testdb # In-memory database named 'testdb'
       username: sa # Default username
       password: password # Default password
       driver-class-name: org.h2.Driver
     jpa:
      database-platform: org.hibernate.dialect.H2Dialect
     hibernate:
       ddl-auto: update # Automatically update the database schema
